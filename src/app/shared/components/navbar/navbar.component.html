<nav class="navbar">
  <div class="nav-inner">

    <!-- Logo -->
    <a routerLink="/home" class="nav-logo">🏆 <span>SportsHub</span></a>

    <!-- Desktop links -->
    <div class="nav-links-desktop">
      <a routerLink="/teams"    routerLinkActive="active">Equipos</a>
      <a routerLink="/players"  routerLinkActive="active">Jugadores</a>
      <a routerLink="/stadiums" routerLinkActive="active">Estadios</a>
    </div>

    <!-- Desktop right -->
    <div class="nav-right-desktop">
      @if (isAdmin()) {
        <a routerLink="/admin" class="btn-admin">⚙️ Admin</a>
      }
      <div class="user-chip">
        <div class="user-avatar">{{ initial() }}</div>
        <span class="user-name">{{ auth.currentUser()?.name }}</span>
      </div>
      <button (click)="auth.logout()" class="btn-logout">Salir</button>
    </div>

    <!-- Mobile hamburger -->
    <button class="hamburger" (click)="menuOpen.set(!menuOpen())">
      <span [class]="menuOpen() ? 'open' : ''"></span>
      <span [class]="menuOpen() ? 'open' : ''"></span>
      <span [class]="menuOpen() ? 'open' : ''"></span>
    </button>
  </div>

  <!-- Mobile menu -->
  @if (menuOpen()) {
    <div class="mobile-menu">
      <a routerLink="/teams"    routerLinkActive="active" (click)="menuOpen.set(false)">🛡️ Equipos</a>
      <a routerLink="/players"  routerLinkActive="active" (click)="menuOpen.set(false)">👤 Jugadores</a>
      <a routerLink="/stadiums" routerLinkActive="active" (click)="menuOpen.set(false)">🏟️ Estadios</a>
      @if (isAdmin()) {
        <a routerLink="/admin" (click)="menuOpen.set(false)" class="mobile-admin">⚙️ Admin</a>
      }
      <div class="mobile-footer">
        <span>{{ auth.currentUser()?.name }}</span>
        <button (click)="auth.logout()">Salir</button>
      </div>
    </div>
  }
</nav>
